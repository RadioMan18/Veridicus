name: CI

# Every push and every pull request runs the two checks that decide whether a
# change is safe to merge: the TypeScript typecheck and the Rust test suite.
# There is no lint or format gate in this repository yet, so neither job adds one.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  rust-tests:
    name: Rust tests
    # The crate links Tauri with Windows-only dependencies (WebView2, winreg and
    # the credential store), so the suite runs on the platform the app ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The default `custom-protocol` feature embeds `dist` into the binary, so
      # the frontend has to exist before the crate will compile.
      - run: npm ci

      - run: npm run build

      # SQLCipher is built from source and links the system OpenSSL, but the
      # Windows images ship OpenSSL "light", without its development headers.
      - name: Install OpenSSL development headers
        shell: pwsh
        run: |
          $root = "C:\Program Files\OpenSSL-Win64"
          if (-not (Test-Path "$root\include\openssl\crypto.h")) {
            choco install openssl --no-progress -y --force
          }
          if (-not (Test-Path "$root\include\openssl\crypto.h")) {
            throw "OpenSSL headers are still missing under $root\include"
          }

      # `Cargo.lock` is ignored by this repository, so the runner resolves the
      # dependency graph fresh rather than pinning it with `--locked`.
      - name: cargo test --bins
        working-directory: src-tauri
        run: cargo test --bins
