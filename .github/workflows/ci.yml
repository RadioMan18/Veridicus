name: CI

# Every push and every pull request runs the checks that decide whether a change
# is safe to merge: the frontend (TypeScript typecheck plus the Vitest suite) and
# the Rust test suite. There is no lint or format gate in this repository yet, so
# neither job adds one.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # The Vitest suites are colocated `src/**/*.test.ts` modules that run in a
      # plain Node environment, so they need nothing from the desktop shell.
      - run: npm test

  rust-tests:
    name: Rust tests
    # The crate links Tauri with Windows-only dependencies (WebView2, winreg and
    # the credential store), so the suite runs on the platform the app ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The default `custom-protocol` feature embeds `dist` into the binary, so
      # the frontend has to exist before the crate will compile.
      - run: npm ci

      - run: npm run build

      # SQLCipher is built from source and links the system OpenSSL, but the
      # Windows images ship OpenSSL "light", without its development headers.
      # `libsqlite3-sys` reads OPENSSL_LIB_DIR and OPENSSL_INCLUDE_DIR ahead of
      # any probing, so both are pinned to whichever install has the headers.
      - name: Install OpenSSL development headers
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files\OpenSSL", "C:\Program Files\OpenSSL-Win64")
          $root = $candidates | Where-Object { Test-Path "$_\include\openssl\crypto.h" } |
            Select-Object -First 1
          if (-not $root) {
            choco install openssl --no-progress -y --force
            $root = $candidates | Where-Object { Test-Path "$_\include\openssl\crypto.h" } |
              Select-Object -First 1
          }
          if (-not $root) {
            throw "OpenSSL development headers were not found in: $($candidates -join ', ')"
          }
          # Prefer the release import library, not the debug one, and the x64 build.
          $lib = Get-ChildItem -Path $root -Recurse -Filter libcrypto.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch '\\MDd\\' } |
            Sort-Object { $_.FullName -match '\\MD\\' } -Descending |
            Select-Object -First 1
          if (-not $lib) {
            throw "No x64 libcrypto.lib was found under $root"
          }
          "OPENSSL_INCLUDE_DIR=$root\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_LIB_DIR=$($lib.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "OpenSSL headers: $root\include"
          Write-Host "OpenSSL libraries: $($lib.Directory.FullName)"

      # `Cargo.lock` is ignored by this repository, so the runner resolves the
      # dependency graph fresh rather than pinning it with `--locked`.
      - name: cargo test --bins
        working-directory: src-tauri
        run: cargo test --bins
