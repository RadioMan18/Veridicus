[package]
name = "veridicus"
version = "1.0.2"
description = "Veridicus Desktop — privacy-first job search OS with honesty guardrails"
authors = ["Veridicus"]
edition = "2021"
# `tauri dev` runs `cargo run`; the smoke harness is a second binary, so name the app here.
default-run = "veridicus"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Live smoke harness (campaign stage 0.9). Off by default so normal builds skip it.
smoke-harness = []

[[bin]]
name = "smoke_apply"
path = "src/bin/smoke_apply.rs"
required-features = ["smoke-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
git2 = "0.20.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
comrak = "0.30"
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
dirs = "3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.20"
htmd = "0.1"
windows = { version = "0.52", features = ["Win32_Security_Credentials"] }
winreg = "0.5"
tauri-plugin-dialog = "2.8.4"
rfd = "0.17.2"
# Only deflate: DOCX and ODT packages use it, and the default features pull a
# C toolchain (bzip2, zstd, xz) the app never needs.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
